name: baraka_market
description: Baraka Market - Premium Supermarket App
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.2.0

  # Network
  dio: ^5.4.3+1

  # Firebase
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.1+2

  # Storage
  flutter_secure_storage: ^10.3.1
  shared_preferences: ^2.3.1

  # UI / Design
  flutter_animate: ^4.5.0
  shimmer: ^3.0.0
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.2
  smooth_page_indicator: ^1.1.0
  carousel_slider: ^5.0.0
  badges: ^3.1.2

  # Camera & Scanner
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2

  # Maps
  google_maps_flutter: ^2.7.0
  geolocator: ^12.0.0

  # Permissions
  permission_handler: ^11.3.1

  # Utils
  intl: ^0.19.0
  equatable: ^2.0.5
  connectivity_plus: ^6.0.3
  url_launcher: ^6.3.0
  path_provider: ^2.1.4

  # Speech
  speech_to_text: ^7.4.0

  # OTP
  pinput: ^3.0.1

  # WebSocket
  socket_io_client: ^2.0.3+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: NunitoSans
      fonts:
        - asset: assets/fonts/NunitoSans-Regular.ttf
        - asset: assets/fonts/NunitoSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/NunitoSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NunitoSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/NunitoSans-ExtraBold.ttf
          weight: 800
